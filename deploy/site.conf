server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location / { try_files $uri $uri/ =404; }
 location ~* \.(?:html|xml|txt)$ { expires -1; }
 location ~* "^/assets/.*-[A-Za-z0-9_-]{8}\.(?:js|css|png|webp|jpg)$" { expires 1y; add_header Cache-Control "public, immutable"; }
 error_page 404 /404.html;
 location = /404.html { internal; }
}
