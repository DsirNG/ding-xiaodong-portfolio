
server {
 listen 80;
 server_name dsircity.top;
 location /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { return 308 https://dsircity.top$request_uri; }
}
server {
 listen 443 ssl;
 http2 on;
 server_name dsircity.top;
 ssl_certificate /etc/letsencrypt/live/dsircity.top/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dsircity.top/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 location / {
  proxy_pass http://ding-xiaodong-portfolio:80;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
}
